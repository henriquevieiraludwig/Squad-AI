# Blueprint do Render: cria o servidor web. O banco é o PostgreSQL da Supabase.
# No Render: New > Blueprint > escolha este repositório. Depois preencha as variáveis marcadas com sync: false.
services:
  - type: web
    name: squad-ai
    runtime: node
    plan: free # troque para starter quando começar a vender (sempre ligado)
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false # Supabase: Connect > Session pooler (porta 5432), com a senha do banco
      - key: ENCRYPTION_KEY
        generateValue: true # 32 bytes aleatórios em base64. Nunca troque depois de criado.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false # seu e-mail: o link do primeiro acesso aparece em Logs
      - key: PUBLIC_URL
        sync: false # opcional: só quando tiver domínio próprio (sem ele, usa o endereço do Render)
      - key: APP_URL
        sync: false # opcional: deixe em branco
      - key: PARTNER_SUBDOMAIN_BASE
        sync: false # ex.: squadai.com.br (parceiros ganham parceiro.squadai.com.br)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false # só para chave de usuário (sk-ant-usr): ID do workspace (wrkspc_...)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # ex.: nao-responda@squadai.com.br (domínio verificado no Resend)
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

