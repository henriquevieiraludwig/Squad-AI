name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: squad
          POSTGRES_PASSWORD: squad
          POSTGRES_DB: squad_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U squad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes (PGlite)
        run: npm test
      - name: Testes (PostgreSQL)
        run: npm test
        env:
          DATABASE_URL: postgres://squad:squad@localhost:5432/squad_test
      - name: Build do site
        run: npm run build
